<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090b10" />
  <title>Mirrors — illustrated song study</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090e;color:#e8e6eb;font:12px/1.4 "IBM Plex Mono",Consolas,monospace}#wrap{position:absolute;inset:0 0 76px;display:grid;place-items:center}#c{display:block;width:min(100vw,calc((100vh - 76px)*1.77778));height:auto;aspect-ratio:16/9;background:#000;cursor:pointer}#ui{position:absolute;inset:auto 0 0;height:76px;background:#10131a;border-top:1px solid #313744;padding:7px 12px 5px}#ui.hidden{display:none}#ui.hidden~#wrap{inset:0}#marks{height:16px;position:relative}.mark{position:absolute;top:0;height:14px;padding-left:3px;border-left:1px solid #b5c8da;color:#a0a4b0;white-space:nowrap;overflow:hidden;font-size:9px;cursor:pointer}.mark:hover{color:#fff;background:#bccbd522}#scrub{display:block;width:100%;height:10px;margin:0;accent-color:#c4b6d2;cursor:pointer}#row{height:29px;display:flex;align-items:center;gap:8px}button,select{height:25px;background:#1a202b;border:1px solid #444c5b;border-radius:2px;color:#e9e8ec;padding:0 9px;font:11px inherit;cursor:pointer}button:hover,select:hover{border-color:#b6c4d5}#row button.active{color:#fff;background:#404653}#info{margin-left:auto;color:#adb2bd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#errs{display:none;position:fixed;inset:8px 8px auto;max-height:35vh;overflow:auto;background:#300;color:#fbb;padding:8px;white-space:pre-wrap;z-index:10}body.export #ui,body.export #errs{display:none!important}body.export #wrap{inset:0}body.export #c{width:1920px;height:1080px;max-width:none}
  </style>
</head>
<body>
  <div id="wrap"><canvas id="c" aria-label="Mirrors animated lyric video"></canvas></div>
  <div id="ui">
    <div id="marks"></div>
    <input id="scrub" type="range" min="0" max="22.8" step="0.001" value="0" aria-label="Seek animation" />
    <div id="row">
      <button id="play">▶ Play</button><button id="restart">↺ Start</button>
      <button data-speed="0.5">½ Slow</button><button data-speed="1" class="active">1×</button><button data-speed="2">2× Fast</button>
      <button id="hide">Hide</button><span id="info">Loading scene, lyrics, and audio…</span>
    </div>
  </div>
  <pre id="errs"></pre>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
